name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The RKI data sets are refreshed upstream several times a week and the app
    # reads their columns directly, so run without a code change too: a renamed
    # column or a new Bundesland spelling should fail here, not in the browser.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # matches the base image in the Dockerfile
  PYTHON_VERSION: "3.14"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the tests read the RKI TSVs; depth 1 keeps the ~500 MB of upstream
          # submodule history out of the runner
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        # requirements.txt exactly, so that a Dependabot bump is what gets tested
        # rather than whatever a developer happens to have in their venv
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check the data sets are present
        run: |
          for tsv in \
            data/Abwassersurveillance_AMELAG/amelag_einzelstandorte.tsv \
            data/GrippeWeb_Daten_des_Wochenberichts/GrippeWeb_Daten_des_Wochenberichts.tsv \
            data/ARE-Konsultationsinzidenz/ARE-Konsultationsinzidenz.tsv
          do
            test -s "$tsv" || { echo "::error::missing $tsv"; exit 1; }
            echo "$(wc -l < "$tsv") lines  $tsv"
          done

      - name: Run tests
        run: pytest -q

      - name: Lint
        # 9.11/10 at the time of writing. The gate catches a regression without
        # demanding a cleanup of the module-level names and dict() calls that
        # pylint dislikes about a Streamlit script.
        run: pylint --fail-under=9.0 app.py geocode.py location_manager.py

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --tag virus-radar:ci .

      - name: Start the container
        run: docker run --detach --name virus-radar-ci --publish 8501:8501 virus-radar:ci

      - name: Wait for the healthcheck
        run: |
          for _ in $(seq 1 60); do
            # a container that died reports no health status at all and would
            # otherwise keep us waiting for the full timeout
            if [ "$(docker inspect --format '{{.State.Running}}' virus-radar-ci)" != "true" ]; then
              echo "::error::container exited instead of starting up"
              exit 1
            fi
            status=$(docker inspect --format '{{.State.Health.Status}}' virus-radar-ci)
            if [ "$status" = healthy ]; then
              echo "healthy"
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 5
          done
          echo "::error::container never became healthy (last status: ${status})"
          exit 1

      - name: The app must not run as root
        # only the cron daemon needs root; the entrypoint drops privileges before
        # exec'ing streamlit, and losing that should fail the build
        run: |
          uid=$(docker exec virus-radar-ci sh -c 'awk "/^Uid:/{print \$2}" /proc/1/status')
          echo "PID 1 runs as uid ${uid}"
          test "${uid}" = "1000"

      - name: The hourly data refresh must work as appuser
        run: docker exec --user appuser virus-radar-ci /bin/bash /app/update.sh

      - name: The app must render without raising
        # a session in the browser is what normally executes app.py, which curl
        # against the health endpoint never touches
        run: |
          docker exec --user appuser --workdir /app virus-radar-ci \
            python -c "import app" > render.log 2>&1
          cat render.log
          # the two forecast defects that used to reach the page: a negative
          # viral load, and a forecast dated to the epoch
          if grep -q "value=-" render.log; then
            echo "::error::a traffic light is showing a negative value"
            exit 1
          fi
          if grep -q "1970" render.log; then
            echo "::error::a forecast is dated 1970"
            exit 1
          fi

      - name: The app must serve
        run: curl --fail --silent --show-error http://localhost:8501/_stcore/health

      - name: Container logs
        if: always()
        run: docker logs virus-radar-ci

      - name: Remove the container
        if: always()
        run: docker rm --force virus-radar-ci
